name: RemoteHub
options:
  bundleIdPrefix: com.remotehub
  deploymentTarget: {iOS: "16.0"}
targets:
  RemoteHub:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RemoteHub
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "RemoteHub necesita la red local para encontrar y controlar tu TV."
        NSBonjourServices: ["_androidtvremote2._tcp", "_airplay._tcp", "_googlecast._tcp", "_samsungmsf._tcp", "_philipstv_s_rpc._tcp", "_philipstv_h_rpc._tcp"]
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotehub.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
