name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid && xcodegen generate
      - run: |
          xcodebuild -project RemoteHub.xcodeproj -scheme RemoteHub -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA con entitlement multicast (ldid)
        run: |
          mkdir -p out/Payload && cp -R build/Build/Products/Release-iphoneos/RemoteHub.app out/Payload/
          ldid -SRemoteHub.entitlements out/Payload/RemoteHub.app/RemoteHub
          (cd out && zip -qr ../RemoteHub-multicast.ipa Payload)
      - uses: actions/upload-artifact@v4
        with: {name: RemoteHub-ipa, path: RemoteHub-multicast.ipa}
