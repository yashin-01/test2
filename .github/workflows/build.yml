name: Build IPA
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid && xcodegen generate
      - run: |
          xcodebuild -project RemoteHub.xcodeproj -scheme RemoteHub -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA con entitlement multicast (ldid)
        run: |
          mkdir -p out/Payload && cp -R build/Build/Products/Release-iphoneos/RemoteHub.app out/Payload/
          ldid -SRemoteHub.entitlements out/Payload/RemoteHub.app/RemoteHub
          (cd out && zip -qr ../RemoteHub.ipa Payload)
      # El IPA queda en Releases como archivo suelto (sin .zip): se descarga directo desde el iPhone.
      - name: Publicar IPA en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest RemoteHub.ipa \
            --title "RemoteHub (última compilación)" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Descarga RemoteHub.ipa y ábrelo con FlareStore / AltStore." \
            --target "$GITHUB_SHA"
